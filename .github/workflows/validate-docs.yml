name: Validate Documentation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Clone repository
        run: |
          git clone https://github.com/${{ github.repository }}.git .
          git checkout ${{ github.ref_name }}
          echo "✅ Repository cloned"
          
      - name: SHOW ALL FILES (Debug)
        run: |
          echo "================================================"
          echo "📂 FULL DIRECTORY STRUCTURE"
          echo "================================================"
          echo ""
          echo "Root directory:"
          ls -la
          echo ""
          echo "Docs directory:"
          ls -la docs/ 2>/dev/null || echo "❌ docs folder does not exist!"
          echo ""
          echo "Looking for files:"
          echo "  ERD files:"
          find . -name "ERD*" -type f 2>/dev/null || echo "    No ERD files found"
          echo ""
          echo "  SQL files:"
          find . -name "*.sql" -type f 2>/dev/null || echo "    No SQL files found"
          echo ""
          echo "  DOCX files:"
          find . -name "*.docx" -type f 2>/dev/null || echo "    No DOCX files found"
          echo ""
          echo "  README files:"
          find . -name "README*" -type f 2>/dev/null || echo "    No README files found"
          echo ""
          echo "================================================"
          
      - name: Validate files
        run: |
          echo "================================================"
          echo "🔍 VALIDATING DOCUMENTATION"
          echo "================================================"
          echo ""
          
          ERROR=0
          
          # Check docs folder
          echo "📁 Checking docs folder..."
          if [ ! -d "docs" ]; then
            echo "  ❌ docs folder does not exist!"
            ERROR=1
          else
            echo "  ✅ docs folder exists"
          fi
          echo ""
          
          # Check ERD.png (EXACT match)
          echo "📊 Checking ERD.png..."
          if [ -f "docs/ERD.png" ]; then
            echo "  ✅ docs/ERD.png found"
          else
            echo "  ❌ docs/ERD.png NOT found"
            echo "     Current docs contents:"
            ls -la docs/ 2>/dev/null || echo "     (docs folder empty)"
            ERROR=1
          fi
          echo ""
          
          # Check RaceDay_API_Endpoint_Plan.docx
          echo "📋 Checking RaceDay_API_Endpoint_Plan.docx..."
          if [ -f "docs/RaceDay_API_Endpoint_Plan.docx" ]; then
            echo "  ✅ docs/RaceDay_API_Endpoint_Plan.docx found"
          else
            echo "  ❌ docs/RaceDay_API_Endpoint_Plan.docx NOT found"
            ERROR=1
          fi
          echo ""
          
          # Check SQL.sql
          echo "🗄️ Checking SQL.sql..."
          if [ -f "docs/SQL.sql" ]; then
            echo "  ✅ docs/SQL.sql found"
          else
            echo "  ❌ docs/SQL.sql NOT found"
            ERROR=1
          fi
          echo ""
          
          # Check README.md
          echo "📖 Checking README.md..."
          if [ -f "README.md" ]; then
            echo "  ✅ README.md found"
          else
            echo "  ❌ README.md NOT found"
            ERROR=1
          fi
          echo ""
          
          # Summary
          echo "================================================"
          if [ $ERROR -eq 0 ]; then
            echo "✅ ALL FILES FOUND - GREEN BUILD ✓"
            echo "================================================"
            exit 0
          else
            echo "❌ MISSING FILES - RED BUILD ✗"
            echo ""
            echo "Files that should be in docs/:"
            echo "  1. docs/ERD.png"
            echo "  2. docs/RaceDay_API_Endpoint_Plan.docx"
            echo "  3. docs/SQL.sql"
            echo "  4. README.md (in root)"
            echo ""
            echo "Current docs/ folder contents:"
            ls -la docs/ 2>/dev/null || echo "  docs folder is missing!"
            echo "================================================"
            exit 1
          fi

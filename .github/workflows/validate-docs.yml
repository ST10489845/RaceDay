name: Validate Documentation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      run: |
        git clone ${{ github.repository }} repo
        cd repo
        git checkout ${{ github.ref_name }}
    
    - name: Validate Required Files
      run: |
        cd repo
        echo "🔍 Validating required files for Part 1..."
        
        # Check docs folder
        if [ ! -d "docs" ]; then
          echo "❌ docs folder missing"
          exit 1
        fi
        echo "✅ docs folder exists"
        
        # Check ERD (any format)
        if [ ! -f "docs/ERD.png" ] && [ ! -f "docs/ERD.pdf" ] && [ ! -f "docs/ERD.jpg" ]; then
          echo "❌ ERD file missing (docs/ERD.png, docs/ERD.pdf, or docs/ERD.jpg)"
          exit 1
        fi
        echo "✅ ERD file found"
        
        # Check API Plan
        if [ ! -f "docs/API_Endpoint_Plan.md" ] && [ ! -f "docs/API_Endpoint_Plan.pdf" ]; then
          echo "❌ API Endpoint Plan missing (docs/API_Endpoint_Plan.md or .pdf)"
          exit 1
        fi
        echo "✅ API Endpoint Plan found"
        
        # Check SQL Script
        if [ ! -f "docs/RaceDay_Database.sql" ]; then
          echo "❌ SQL Script missing (docs/RaceDay_Database.sql)"
          exit 1
        fi
        echo "✅ SQL Script found"
        
        # Check README
        if [ ! -f "README.md" ]; then
          echo "❌ README.md missing"
          exit 1
        fi
        echo "✅ README.md found"
        
        # Check SQL content
        TABLE_COUNT=$(grep -c "CREATE TABLE" docs/RaceDay_Database.sql || true)
        INSERT_COUNT=$(grep -c "INSERT INTO" docs/RaceDay_Database.sql || true)
        CONSTRAINT_COUNT=$(grep -c "FOREIGN KEY" docs/RaceDay_Database.sql || true)
        
        echo ""
        echo "📊 SQL Analysis:"
        echo "   - Tables: $TABLE_COUNT"
        echo "   - INSERT statements: $INSERT_COUNT"
        echo "   - FOREIGN KEY constraints: $CONSTRAINT_COUNT"
        
        # Count commits
        COMMIT_COUNT=$(git rev-list --count HEAD)
        echo "📊 Total commits: $COMMIT_COUNT"
        
        echo ""
        echo "✅ All validation checks passed!"
        echo "🎉 Green Build ✓"

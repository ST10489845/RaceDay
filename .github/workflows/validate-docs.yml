name: Validate Documentation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      # Manually clone the repository without using actions/checkout
      - name: Clone repository
        run: |
          # Install git if not present
          sudo apt-get update -qq
          sudo apt-get install -y -qq git
          
          # Clone the repository
          git clone --depth 1 https://github.com/${{ github.repository }}.git repo
          cd repo
          echo "REPO_PATH=$(pwd)" >> $GITHUB_ENV
          echo "✅ Repository cloned successfully"
      
      - name: Validate files
        run: |
          cd repo || cd $REPO_PATH
          
          echo "================================================"
          echo "🔍 VALIDATING DOCUMENTATION - PART 1"
          echo "================================================"
          echo ""
          
          ERROR_COUNT=0
          
          # Check docs folder
          echo "📁 Checking docs folder..."
          if [ ! -d "docs" ]; then
            echo "  ❌ ERROR: docs folder not found!"
            ERROR_COUNT=$((ERROR_COUNT + 1))
          else
            echo "  ✅ docs folder exists"
            echo "  📂 Contents:"
            ls -la docs/
          fi
          echo ""
          
          # Check ERD.png
          echo "📊 Checking ERD.png..."
          if [ -f "docs/ERD.png" ]; then
            echo "  ✅ ERD.png found"
          else
            echo "  ❌ ERROR: ERD.png not found in docs/"
            ERROR_COUNT=$((ERROR_COUNT + 1))
          fi
          echo ""
          
          # Check API Endpoint Plan
          echo "📋 Checking RaceDay_API_Endpoint_Plan.docx..."
          if [ -f "docs/RaceDay_API_Endpoint_Plan.docx" ]; then
            echo "  ✅ RaceDay_API_Endpoint_Plan.docx found"
          else
            echo "  ❌ ERROR: RaceDay_API_Endpoint_Plan.docx not found in docs/"
            ERROR_COUNT=$((ERROR_COUNT + 1))
          fi
          echo ""
          
          # Check SQL.sql
          echo "🗄️ Checking SQL.sql..."
          if [ -f "docs/SQL.sql" ]; then
            echo "  ✅ SQL.sql found"
          else
            echo "  ❌ ERROR: SQL.sql not found in docs/"
            ERROR_COUNT=$((ERROR_COUNT + 1))
          fi
          echo ""
          
          # Check README
          echo "📖 Checking README.md..."
          if [ -f "README.md" ]; then
            echo "  ✅ README.md found"
          else
            echo "  ❌ ERROR: README.md not found in root!"
            ERROR_COUNT=$((ERROR_COUNT + 1))
          fi
          echo ""
          
          # Summary
          echo "================================================"
          echo "📊 VALIDATION SUMMARY"
          echo "================================================"
          echo "  Total Errors: $ERROR_COUNT"
          echo ""
          
          if [ $ERROR_COUNT -eq 0 ]; then
            echo "✅✅✅ ALL REQUIRED FILES ARE PRESENT ✅✅✅"
            echo "🎉 GREEN BUILD - VALIDATION PASSED"
            echo "================================================"
            exit 0
          else
            echo "❌❌❌ VALIDATION FAILED - $ERROR_COUNT ERROR(S) FOUND ❌❌❌"
            echo ""
            echo "Expected files in docs/ folder:"
            echo "  1. ✅ docs/ERD.png"
            echo "  2. ✅ docs/RaceDay_API_Endpoint_Plan.docx"
            echo "  3. ✅ docs/SQL.sql"
            echo "  4. ✅ README.md"
            echo ""
            echo "Current docs/ folder contents:"
            ls -la docs/ 2>/dev/null || echo "  docs/ folder does not exist"
            echo "================================================"
            exit 1
          fi
      
      - name: Analyze SQL
        if: success() || failure()
        run: |
          cd repo || cd $REPO_PATH
          
          echo ""
          echo "================================================"
          echo "🗄️ SQL SCRIPT ANALYSIS"
          echo "================================================"
          
          if [ -f "docs/SQL.sql" ]; then
            SQL_FILE="docs/SQL.sql"
          else
            echo "⚠️ No SQL file found for analysis"
            exit 0
          fi
          
          echo "📄 Analyzing: $SQL_FILE"
          echo ""
          
          # Count tables
          TABLE_COUNT=$(grep -c "CREATE TABLE" "$SQL_FILE" 2>/dev/null || echo "0")
          echo "  📊 CREATE TABLE statements: $TABLE_COUNT"
          
          # Count INSERT statements
          INSERT_COUNT=$(grep -c "INSERT INTO" "$SQL_FILE" 2>/dev/null || echo "0")
          echo "  📊 INSERT statements: $INSERT_COUNT"
          
          # Count FOREIGN KEY constraints
          FK_COUNT=$(grep -c "FOREIGN KEY" "$SQL_FILE" 2>/dev/null || echo "0")
          echo "  📊 FOREIGN KEY constraints: $FK_COUNT"
          
          # Count PRIMARY KEY definitions
          PK_COUNT=$(grep -c "PRIMARY KEY" "$SQL_FILE" 2>/dev/null || echo "0")
          echo "  📊 PRIMARY KEY definitions: $PK_COUNT"
          
          echo ""
          if [ $TABLE_COUNT -ge 6 ]; then
            echo "  ✅ Table count ($TABLE_COUNT) meets minimum of 6"
          else
            echo "  ⚠️ Warning: Table count ($TABLE_COUNT) is less than 6"
          fi
          
          echo ""
          echo "================================================"
      
      - name: Check commits
        run: |
          cd repo || cd $REPO_PATH
          
          echo ""
          echo "================================================"
          echo "📊 COMMIT STATISTICS"
          echo "================================================"
          
          COMMIT_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo "0")
          echo "  📊 Total commits: $COMMIT_COUNT"
          
          if [ $COMMIT_COUNT -ge 20 ]; then
            echo "  ✅ Commit count meets minimum requirement (20+)"
          else
            echo "  ⚠️ Warning: Only $COMMIT_COUNT commits (minimum 20)"
          fi
          
          echo ""
          echo "  📋 Recent commits:"
          git log --oneline -5 2>/dev/null | sed 's/^/    /' || echo "    No commits found"
          echo ""
          echo "================================================"
      
      - name: Final Success
        if: success()
        run: |
          echo ""
          echo "🎉🎉🎉================================================"
          echo "🎉🎉🎉  SUCCESS - GREEN BUILD PASSED  🎉🎉🎉"
          echo "🎉🎉🎉================================================"
          echo ""
          echo "✅ All required documentation files are present"
          echo "✅ SQL script analysis completed"
          echo "✅ Validation passed successfully"
          echo ""
          echo "📁 Files found in docs/:"
          cd repo || cd $REPO_PATH
          ls -la docs/
          echo ""
          echo "🔗 Repository: ${{ github.repository }}"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "📊 Commits: $(git rev-list --count HEAD 2>/dev/null || echo 'N/A')"
          echo ""
          echo "💡 Next Steps:"
          echo "  1. ✅ Ensure YouTube video is uploaded and linked in README"
          echo "  2. ✅ Submit GitHub link on ARC"
          echo "================================================"
      
      - name: Final Failure
        if: failure()
        run: |
          echo ""
          echo "❌❌❌================================================"
          echo "❌❌❌  FAILED - RED BUILD  ❌❌❌"
          echo "❌❌❌================================================"
          echo ""
          echo "One or more required files are missing!"
          echo ""
          echo "Required files that MUST be in docs/:"
          echo "  1. 📊 docs/ERD.png"
          echo "  2. 📋 docs/RaceDay_API_Endpoint_Plan.docx"
          echo "  3. 🗄️ docs/SQL.sql"
          echo "  4. 📖 README.md"
          echo ""
          echo "Current docs/ folder contents:"
          cd repo || cd $REPO_PATH
          if [ -d "docs" ]; then
            ls -la docs/
          else
            echo "  docs/ folder does not exist!"
          fi
          echo ""
          echo "Please fix the issues and push again."
          echo "================================================"
          exit 1

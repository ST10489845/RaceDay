name: Validate Documentation - Part 1

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4  # Updated to v4
      with:
        fetch-depth: 0
    
    - name: Setup environment
      run: |
        echo "✅ Starting documentation validation..."
        echo "📁 Repository: ${{ github.repository }}"
        echo "🌿 Branch: ${{ github.ref_name }}"
    
    - name: Check docs folder exists
      id: check-docs
      run: |
        if [ ! -d "docs" ]; then
          echo "❌ Error: docs folder not found!"
          echo "Please create a 'docs' folder in the root directory."
          exit 1
        fi
        echo "✅ docs folder exists"
        ls -la docs/
    
    - name: Check ERD file exists
      id: check-erd
      run: |
        if [ ! -f "docs/ERD.png" ] && [ ! -f "docs/ERD.pdf" ] && [ ! -f "docs/ERD.jpg" ]; then
          echo "❌ Error: ERD file not found in docs folder!"
          echo "Required: docs/ERD.png or docs/ERD.pdf or docs/ERD.jpg"
          echo "Please add your Entity Relationship Diagram."
          exit 1
        fi
        
        if [ -f "docs/ERD.png" ]; then
          echo "✅ ERD.png found"
          echo "File size: $(du -h docs/ERD.png | cut -f1)"
        elif [ -f "docs/ERD.pdf" ]; then
          echo "✅ ERD.pdf found"
          echo "File size: $(du -h docs/ERD.pdf | cut -f1)"
        elif [ -f "docs/ERD.jpg" ]; then
          echo "✅ ERD.jpg found"
          echo "File size: $(du -h docs/ERD.jpg | cut -f1)"
        fi
    
    - name: Check API Endpoint Plan exists
      id: check-api-plan
      run: |
        if [ ! -f "docs/API_Endpoint_Plan.md" ] && [ ! -f "docs/API_Endpoint_Plan.pdf" ] && [ ! -f "docs/API_Endpoint_Plan.txt" ]; then
          echo "❌ Error: API Endpoint Plan not found in docs folder!"
          echo "Required: docs/API_Endpoint_Plan.md or docs/API_Endpoint_Plan.pdf"
          echo "Please add your API endpoint plan."
          exit 1
        fi
        
        if [ -f "docs/API_Endpoint_Plan.md" ]; then
          echo "✅ API_Endpoint_Plan.md found"
          echo "File size: $(du -h docs/API_Endpoint_Plan.md | cut -f1)"
          echo "Checking file content..."
          
          if grep -qi "HTTP Method" docs/API_Endpoint_Plan.md; then
            echo "✅ Contains HTTP Method column"
          else
            echo "⚠️ Warning: Might not have the required table format"
          fi
          
          if grep -qi "Route" docs/API_Endpoint_Plan.md; then
            echo "✅ Contains Route column"
          else
            echo "⚠️ Warning: Might not have the required table format"
          fi
          
          if grep -qi "Role Required" docs/API_Endpoint_Plan.md; then
            echo "✅ Contains Role Required column"
          else
            echo "⚠️ Warning: Might not have the required table format"
          fi
          
        elif [ -f "docs/API_Endpoint_Plan.pdf" ]; then
          echo "✅ API_Endpoint_Plan.pdf found"
          echo "File size: $(du -h docs/API_Endpoint_Plan.pdf | cut -f1)"
        elif [ -f "docs/API_Endpoint_Plan.txt" ]; then
          echo "✅ API_Endpoint_Plan.txt found"
          echo "File size: $(du -h docs/API_Endpoint_Plan.txt | cut -f1)"
        fi
    
    - name: Check SQL Database Script exists
      id: check-sql
      run: |
        if [ ! -f "docs/RaceDay_Database.sql" ] && [ ! -f "docs/database.sql" ] && [ ! -f "docs/schema.sql" ]; then
          echo "❌ Error: SQL script not found in docs folder!"
          echo "Required: docs/RaceDay_Database.sql"
          echo "Please add your SQL database creation script."
          exit 1
        fi
        
        if [ -f "docs/RaceDay_Database.sql" ]; then
          echo "✅ RaceDay_Database.sql found"
          echo "File size: $(du -h docs/RaceDay_Database.sql | cut -f1)"
          
          echo "Checking SQL script content..."
          
          CREATE_TABLE_COUNT=$(grep -c "CREATE TABLE" docs/RaceDay_Database.sql || true)
          echo "✅ Found $CREATE_TABLE_COUNT CREATE TABLE statements"
          
          if [ $CREATE_TABLE_COUNT -lt 6 ]; then
            echo "⚠️ Warning: You have less than 6 CREATE TABLE statements"
            echo "The ERD requires a minimum of 6 entities."
          fi
          
          INSERT_COUNT=$(grep -c "INSERT INTO" docs/RaceDay_Database.sql || true)
          echo "✅ Found $INSERT_COUNT INSERT statements"
          
          if [ $INSERT_COUNT -lt 4 ]; then
            echo "⚠️ Warning: You have less than 4 INSERT statements"
            echo "Please add sample data for testing."
          fi
          
          FOREIGN_KEY_COUNT=$(grep -c "FOREIGN KEY" docs/RaceDay_Database.sql || true)
          echo "✅ Found $FOREIGN_KEY_COUNT FOREIGN KEY constraints"
          
          PRIMARY_KEY_COUNT=$(grep -c "PRIMARY KEY" docs/RaceDay_Database.sql || true)
          echo "✅ Found $PRIMARY_KEY_COUNT PRIMARY KEY definitions"
          
        elif [ -f "docs/database.sql" ]; then
          echo "✅ database.sql found"
        elif [ -f "docs/schema.sql" ]; then
          echo "✅ schema.sql found"
        fi
    
    - name: Check README.md exists
      id: check-readme
      run: |
        if [ ! -f "README.md" ]; then
          echo "❌ Error: README.md not found in root directory!"
          echo "Please create a README.md file with project documentation."
          exit 1
        fi
        echo "✅ README.md found"
        echo "File size: $(du -h README.md | cut -f1)"
        
        echo "Checking README content..."
        
        if grep -qi "RaceDay" README.md; then
          echo "✅ README contains system name"
        else
          echo "⚠️ Warning: README might not have the system name"
        fi
        
        if grep -qi "Organiser" README.md && grep -qi "Participant" README.md; then
          echo "✅ README describes both user roles"
        else
          echo "⚠️ Warning: README might not describe both user roles"
        fi
        
        if grep -qi "YouTube" README.md || grep -qi "youtube.com" README.md || grep -qi "youtu.be" README.md; then
          echo "✅ README contains YouTube link"
        else
          echo "⚠️ Warning: README might not have the video link"
        fi
        
        if grep -qi "CI/CD" README.md || grep -qi "build" README.md; then
          echo "✅ README contains CI/CD information"
        else
          echo "⚠️ Warning: README might not have CI/CD information"
        fi
    
    - name: Check .gitignore exists
      id: check-gitignore
      run: |
        if [ ! -f ".gitignore" ]; then
          echo "⚠️ Warning: .gitignore file not found"
          echo "It's recommended to have a .gitignore file."
        else
          echo "✅ .gitignore found"
        fi
    
    - name: Count commits
      id: count-commits
      run: |
        COMMIT_COUNT=$(git rev-list --count HEAD)
        echo "📊 Total commits: $COMMIT_COUNT"
        echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
        
        if [ $COMMIT_COUNT -lt 20 ]; then
          echo "⚠️ Warning: You have only $COMMIT_COUNT commits"
          echo "The assignment requires a minimum of 20 meaningful commits"
          echo "Please make more commits before submitting."
        else
          echo "✅ You have $COMMIT_COUNT commits (minimum 20 met)"
        fi
    
    - name: Generate documentation report
      id: generate-report
      run: |
        echo "# Documentation Validation Report" > docs/validation_report.md
        echo "" >> docs/validation_report.md
        echo "## Repository: ${{ github.repository }}" >> docs/validation_report.md
        echo "**Commit Count:** ${{ steps.count-commits.outputs.commit_count }}" >> docs/validation_report.md
        echo "" >> docs/validation_report.md
        echo "### Files Found:" >> docs/validation_report.md
        echo "" >> docs/validation_report.md
        
        echo "| File | Status | Notes |" >> docs/validation_report.md
        echo "|------|--------|-------|" >> docs/validation_report.md
        
        if [ -f "docs/ERD.png" ] || [ -f "docs/ERD.pdf" ] || [ -f "docs/ERD.jpg" ]; then
          echo "| ERD | ✅ Found | Present |" >> docs/validation_report.md
        else
          echo "| ERD | ❌ Missing | Required |" >> docs/validation_report.md
        fi
        
        if [ -f "docs/API_Endpoint_Plan.md" ] || [ -f "docs/API_Endpoint_Plan.pdf" ]; then
          echo "| API Endpoint Plan | ✅ Found | Present |" >> docs/validation_report.md
        else
          echo "| API Endpoint Plan | ❌ Missing | Required |" >> docs/validation_report.md
        fi
        
        if [ -f "docs/RaceDay_Database.sql" ]; then
          echo "| SQL Database Script | ✅ Found | Present |" >> docs/validation_report.md
        else
          echo "| SQL Database Script | ❌ Missing | Required |" >> docs/validation_report.md
        fi
        
        if [ -f "README.md" ]; then
          echo "| README.md | ✅ Found | Present |" >> docs/validation_report.md
        else
          echo "| README.md | ❌ Missing | Required |" >> docs/validation_report.md
        fi
        
        if [ -f ".github/workflows/validate-docs.yml" ]; then
          echo "| CI/CD Workflow | ✅ Found | Present |" >> docs/validation_report.md
        else
          echo "| CI/CD Workflow | ❌ Missing | Required |" >> docs/validation_report.md
        fi
        
        echo "" >> docs/validation_report.md
        echo "### File Sizes:" >> docs/validation_report.md
        echo "" >> docs/validation_report.md
        echo "\`\`\`" >> docs/validation_report.md
        du -h docs/* 2>/dev/null >> docs/validation_report.md 2>&1 || echo "No files in docs" >> docs/validation_report.md
        echo "\`\`\`" >> docs/validation_report.md
        
        cat docs/validation_report.md
    
    - name: Upload validation report
      uses: actions/upload-artifact@v4  # Updated to v4
      with:
        name: validation-report
        path: docs/validation_report.md
    
    - name: Success message
      if: success()
      run: |
        echo "🎉 All documentation validation checks passed!"
        echo "✅ docs folder: Found"
        echo "✅ ERD file: Found"
        echo "✅ API Endpoint Plan: Found"
        echo "✅ SQL Script: Found"
        echo "✅ README.md: Found"
        echo "✅ Commits: ${{ steps.count-commits.outputs.commit_count }} (min 20)"
        echo ""
        echo "📊 Validation Summary:"
        echo "   - Repository: ${{ github.repository }}"
        echo "   - Branch: ${{ github.ref_name }}"
        echo "   - Commit Count: ${{ steps.count-commits.outputs.commit_count }}"
        echo ""
        echo "💡 Next Steps:"
        echo "   1. Ensure your YouTube video is uploaded and linked in README"
        echo "   2. Verify CI/CD shows green check mark ✓"
        echo "   3. Submit GitHub link on ARC"
    
    - name: Failure message
      if: failure()
      run: |
        echo "❌ Documentation validation failed!"
        echo ""
        echo "Common issues:"
        echo "1. Missing docs folder"
        echo "2. Missing ERD diagram (docs/ERD.png, docs/ERD.pdf, or docs/ERD.jpg)"
        echo "3. Missing API Endpoint Plan (docs/API_Endpoint_Plan.md or docs/API_Endpoint_Plan.pdf)"
        echo "4. Missing SQL script (docs/RaceDay_Database.sql)"
        echo "5. Missing or incomplete README.md"
        echo ""
        echo "Please fix the issues and push again."
        exit 1

  validate-sql:
    name: Validate SQL Syntax
    runs-on: ubuntu-latest
    needs: validate-docs
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4  # Updated to v4
    
    - name: Basic SQL syntax check
      id: sql-check
      run: |
        if [ -f "docs/RaceDay_Database.sql" ]; then
          echo "📄 Checking SQL script..."
          
          # Count tables
          TABLE_COUNT=$(grep -c "CREATE TABLE" docs/RaceDay_Database.sql || true)
          echo "✅ Found $TABLE_COUNT tables"
          
          # Check for GO statements
          GO_COUNT=$(grep -c "^GO" docs/RaceDay_Database.sql || true)
          echo "✅ Found $GO_COUNT GO statements"
          
          # Check for required tables
          REQUIRED_TABLES=("Users" "Organisers" "Participants" "Events" "Categories" "Enrolments")
          MISSING_TABLES=()
          
          for table in "${REQUIRED_TABLES[@]}"; do
            if grep -q "CREATE TABLE $table" docs/RaceDay_Database.sql; then
              echo "✅ Found $table table"
            else
              echo "❌ Missing $table table"
              MISSING_TABLES+=("$table")
            fi
          done
          
          if [ ${#MISSING_TABLES[@]} -ne 0 ]; then
            echo "⚠️ Warning: Missing required tables: ${MISSING_TABLES[*]}"
          fi
          
          echo "✅ Basic SQL syntax check completed"
        else
          echo "❌ SQL script not found"
          exit 1
        fi

  validate-commits:
    name: Validate Commit Quality
    runs-on: ubuntu-latest
    needs: validate-docs
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4  # Updated to v4
      with:
        fetch-depth: 0
    
    - name: Check commit quality
      run: |
        echo "📝 Checking commit quality..."
        
        # Get commit messages
        echo "## Recent Commits" > commit_report.md
        echo "" >> commit_report.md
        echo "\`\`\`" >> commit_report.md
        git log --oneline -20 >> commit_report.md
        echo "\`\`\`" >> commit_report.md
        echo "" >> commit_report.md
        
        # Count meaningful commits (exclude common generic messages)
        MEANINGFUL_COMMITS=$(git log --oneline | grep -v -E "(typo|fix|update|wip|temp|test|minor|small|quick|docs|readme|format|style|clean)" | wc -l || true)
        echo "📊 Meaningful commits: $MEANINGFUL_COMMITS"
        
        echo "### Commit Statistics" >> commit_report.md
        echo "- Total commits: $(git rev-list --count HEAD)" >> commit_report.md
        echo "- Meaningful commits: $MEANINGFUL_COMMITS" >> commit_report.md
        echo "" >> commit_report.md
        
        cat commit_report.md

name: Validate Documentation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      # Use the older version that doesn't have Node.js issues
      - name: Checkout
        uses: actions/checkout@v3
        
      - name: Show ALL files
        run: |
          echo "================================================"
          echo "📂 COMPLETE FILE LIST"
          echo "================================================"
          echo ""
          echo "All files in repository:"
          find . -type f | grep -v ".git" | sort
          echo ""
          echo "================================================"
      
      - name: Auto-detect and validate files
        run: |
          echo "================================================"
          echo "🔍 AUTO-DETECTING VALIDATION FILES"
          echo "================================================"
          echo ""
          
          ERROR=0
          
          # Find ANY ERD file (png, pdf, jpg, jpeg, etc)
          echo "📊 Looking for ERD file..."
          ERD_FOUND=""
          for ext in png pdf jpg jpeg gif bmp; do
            for file in ERD erd diagram Diagram; do
              if [ -f "$file.$ext" ]; then
                echo "  ✅ Found: $file.$ext"
                ERD_FOUND="$file.$ext"
                break 2
              fi
            done
          done
          # Also check in docs folder
          if [ -z "$ERD_FOUND" ]; then
            for ext in png pdf jpg jpeg gif bmp; do
              for file in ERD erd diagram Diagram; do
                if [ -f "docs/$file.$ext" ]; then
                  echo "  ✅ Found: docs/$file.$ext"
                  ERD_FOUND="docs/$file.$ext"
                  break 2
                fi
              done
            done
          fi
          if [ -z "$ERD_FOUND" ]; then
            echo "  ❌ No ERD file found (looking for: ERD.png, ERD.pdf, diagram.png, etc)"
            ERROR=1
          fi
          echo ""
          
          # Find ANY API Plan file
          echo "📋 Looking for API Endpoint Plan..."
          API_FOUND=""
          for file in RaceDay_API_Endpoint_Plan API_Endpoint_Plan API_Plan Endpoint_Plan; do
            for ext in docx pdf md txt; do
              if [ -f "$file.$ext" ]; then
                echo "  ✅ Found: $file.$ext"
                API_FOUND="$file.$ext"
                break 2
              fi
            done
          done
          if [ -z "$API_FOUND" ]; then
            for file in RaceDay_API_Endpoint_Plan API_Endpoint_Plan API_Plan Endpoint_Plan; do
              for ext in docx pdf md txt; do
                if [ -f "docs/$file.$ext" ]; then
                  echo "  ✅ Found: docs/$file.$ext"
                  API_FOUND="docs/$file.$ext"
                  break 2
                fi
              done
            done
          fi
          if [ -z "$API_FOUND" ]; then
            echo "  ❌ No API Endpoint Plan found"
            ERROR=1
          fi
          echo ""
          
          # Find ANY SQL file
          echo "🗄️ Looking for SQL file..."
          SQL_FOUND=""
          for file in SQL RaceDay_Database database schema; do
            if [ -f "$file.sql" ]; then
              echo "  ✅ Found: $file.sql"
              SQL_FOUND="$file.sql"
              break
            fi
          done
          if [ -z "$SQL_FOUND" ]; then
            for file in SQL RaceDay_Database database schema; do
              if [ -f "docs/$file.sql" ]; then
                echo "  ✅ Found: docs/$file.sql"
                SQL_FOUND="docs/$file.sql"
                break
              fi
            done
          fi
          if [ -z "$SQL_FOUND" ]; then
            echo "  ❌ No SQL file found (looking for: SQL.sql, database.sql, etc)"
            ERROR=1
          fi
          echo ""
          
          # Find README
          echo "📖 Looking for README..."
          if [ -f "README.md" ]; then
            echo "  ✅ Found: README.md"
          elif [ -f "readme.md" ]; then
            echo "  ✅ Found: readme.md"
          else
            echo "  ❌ No README.md found"
            ERROR=1
          fi
          echo ""
          
          # Summary
          echo "================================================"
          if [ $ERROR -eq 0 ]; then
            echo "✅✅✅ ALL FILES FOUND - GREEN BUILD ✅✅✅"
            echo ""
            echo "Found files:"
            echo "  📊 ERD: $ERD_FOUND"
            echo "  📋 API Plan: $API_FOUND"
            echo "  🗄️ SQL: $SQL_FOUND"
            echo "  📖 README: README.md"
            echo "================================================"
            exit 0
          else
            echo "❌❌❌ MISSING FILES - RED BUILD ❌❌❌"
            echo ""
            echo "The workflow is looking for:"
            echo "  1. Any ERD file (ERD.png, ERD.pdf, diagram.png, etc)"
            echo "  2. Any API Plan (RaceDay_API_Endpoint_Plan.docx, API_Endpoint_Plan.md, etc)"
            echo "  3. Any SQL file (SQL.sql, database.sql, schema.sql, etc)"
            echo "  4. README.md"
            echo ""
            echo "Current files in repository:"
            find . -type f | grep -v ".git" | sort
            echo "================================================"
            exit 1
          fi
      
      - name: Analyze SQL (if found)
        if: success() || failure()
        run: |
          echo ""
          echo "================================================"
          echo "🗄️ SQL SCRIPT ANALYSIS"
          echo "================================================"
          
          # Find SQL file
          SQL_FILE=""
          for file in SQL RaceDay_Database database schema; do
            if [ -f "$file.sql" ]; then
              SQL_FILE="$file.sql"
              break
            fi
          done
          if [ -z "$SQL_FILE" ]; then
            for file in SQL RaceDay_Database database schema; do
              if [ -f "docs/$file.sql" ]; then
                SQL_FILE="docs/$file.sql"
                break
              fi
            done
          fi
          
          if [ -z "$SQL_FILE" ]; then
            echo "⚠️ No SQL file found for analysis"
            exit 0
          fi
          
          echo "📄 Analyzing: $SQL_FILE"
          echo ""
          
          TABLE_COUNT=$(grep -c "CREATE TABLE" "$SQL_FILE" 2>/dev/null || echo "0")
          echo "  📊 CREATE TABLE statements: $TABLE_COUNT"
          
          INSERT_COUNT=$(grep -c "INSERT INTO" "$SQL_FILE" 2>/dev/null || echo "0")
          echo "  📊 INSERT statements: $INSERT_COUNT"
          
          FK_COUNT=$(grep -c "FOREIGN KEY" "$SQL_FILE" 2>/dev/null || echo "0")
          echo "  📊 FOREIGN KEY constraints: $FK_COUNT"
          
          echo ""
          if [ $TABLE_COUNT -ge 6 ]; then
            echo "  ✅ Table count ($TABLE_COUNT) meets minimum of 6"
          else
            echo "  ⚠️ Warning: Table count ($TABLE_COUNT) is less than 6"
          fi
          echo ""
          echo "================================================"
      
      - name: Check commits
        run: |
          echo ""
          echo "================================================"
          echo "📊 COMMIT STATISTICS"
          echo "================================================"
          
          COMMIT_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo "0")
          echo "  📊 Total commits: $COMMIT_COUNT"
          
          if [ $COMMIT_COUNT -ge 20 ]; then
            echo "  ✅ Commit count meets minimum requirement (20+)"
          else
            echo "  ⚠️ Warning: Only $COMMIT_COUNT commits (minimum 20)"
          fi
          echo ""
          echo "================================================"
      
      - name: Success
        if: success()
        run: |
          echo ""
          echo "🎉🎉🎉================================================"
          echo "🎉🎉🎉  GREEN BUILD - SUCCESS  🎉🎉🎉"
          echo "🎉🎉🎉================================================"
          echo ""
          echo "✅ All required files found"
          echo "✅ Validation passed"
          echo ""
          echo "🔗 Repository: ${{ github.repository }}"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "================================================"
      
      - name: Failure
        if: failure()
        run: |
          echo ""
          echo "❌❌❌================================================"
          echo "❌❌❌  RED BUILD - FAILED  ❌❌❌"
          echo "❌❌❌================================================"
          echo ""
          echo "The workflow couldn't find all required files."
          echo ""
          echo "Please check the file list above and ensure you have:"
          echo "  1. An ERD file (ERD.png, ERD.pdf, etc)"
          echo "  2. An API Endpoint Plan (RaceDay_API_Endpoint_Plan.docx, etc)"
          echo "  3. An SQL file (SQL.sql, RaceDay_Database.sql, etc)"
          echo "  4. README.md"
          echo ""
          echo "The workflow showed all files in your repository."
          echo "Check the 'Show ALL files' step output above."
          echo "================================================"
          exit 1

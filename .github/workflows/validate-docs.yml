name: Validate Documentation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Debug - Show what files exist
        run: |
          echo "================================================"
          echo "📂 CURRENT DIRECTORY STRUCTURE"
          echo "================================================"
          echo ""
          echo "Root directory:"
          ls -la
          echo ""
          echo "docs folder (if exists):"
          ls -la docs/ 2>/dev/null || echo "  docs folder does not exist"
          echo ""
          echo "================================================"
      
      - name: Validate Documentation
        run: |
          echo "================================================"
          echo "🔍 VALIDATING DOCUMENTATION - PART 1"
          echo "================================================"
          echo ""
          
          ERROR_COUNT=0
          
          # Check docs folder
          echo "📁 Checking docs folder..."
          if [ ! -d "docs" ]; then
            echo "  ❌ ERROR: docs folder not found!"
            ERROR_COUNT=$((ERROR_COUNT + 1))
          else
            echo "  ✅ docs folder exists"
          fi
          echo ""
          
          # Check for ANY ERD file (png, pdf, jpg, jpeg)
          echo "📊 Checking ERD file..."
          ERD_FOUND=0
          if [ -f "docs/ERD.png" ]; then
            echo "  ✅ ERD.png found"
            ERD_FOUND=1
          elif [ -f "docs/ERD.pdf" ]; then
            echo "  ✅ ERD.pdf found"
            ERD_FOUND=1
          elif [ -f "docs/ERD.jpg" ]; then
            echo "  ✅ ERD.jpg found"
            ERD_FOUND=1
          elif [ -f "docs/ERD.jpeg" ]; then
            echo "  ✅ ERD.jpeg found"
            ERD_FOUND=1
          else
            echo "  ❌ No ERD file found (ERD.png, ERD.pdf, ERD.jpg, ERD.jpeg)"
            ERROR_COUNT=$((ERROR_COUNT + 1))
          fi
          echo ""
          
          # Check for ANY API Endpoint Plan file
          echo "📋 Checking API Endpoint Plan..."
          API_FOUND=0
          if [ -f "docs/RaceDay_API_Endpoint_Plan.docx" ]; then
            echo "  ✅ RaceDay_API_Endpoint_Plan.docx found"
            API_FOUND=1
          elif [ -f "docs/RaceDay_API_Endpoint_Plan.pdf" ]; then
            echo "  ✅ RaceDay_API_Endpoint_Plan.pdf found"
            API_FOUND=1
          elif [ -f "docs/API_Endpoint_Plan.md" ]; then
            echo "  ✅ API_Endpoint_Plan.md found"
            API_FOUND=1
          elif [ -f "docs/API_Endpoint_Plan.docx" ]; then
            echo "  ✅ API_Endpoint_Plan.docx found"
            API_FOUND=1
          elif [ -f "docs/API_Endpoint_Plan.pdf" ]; then
            echo "  ✅ API_Endpoint_Plan.pdf found"
            API_FOUND=1
          else
            echo "  ❌ No API Endpoint Plan found"
            echo "     Please add: RaceDay_API_Endpoint_Plan.docx"
            ERROR_COUNT=$((ERROR_COUNT + 1))
          fi
          echo ""
          
          # Check for ANY SQL file
          echo "🗄️ Checking SQL Script..."
          SQL_FOUND=0
          if [ -f "docs/SQL.sql" ]; then
            echo "  ✅ SQL.sql found"
            SQL_FOUND=1
          elif [ -f "docs/RaceDay_Database.sql" ]; then
            echo "  ✅ RaceDay_Database.sql found"
            SQL_FOUND=1
          elif [ -f "docs/database.sql" ]; then
            echo "  ✅ database.sql found"
            SQL_FOUND=1
          elif [ -f "docs/schema.sql" ]; then
            echo "  ✅ schema.sql found"
            SQL_FOUND=1
          else
            echo "  ❌ No SQL file found"
            echo "     Please add: SQL.sql or RaceDay_Database.sql"
            ERROR_COUNT=$((ERROR_COUNT + 1))
          fi
          echo ""
          
          # Check README
          echo "📖 Checking README.md..."
          if [ -f "README.md" ]; then
            echo "  ✅ README.md found"
          else
            echo "  ❌ ERROR: README.md not found in root!"
            ERROR_COUNT=$((ERROR_COUNT + 1))
          fi
          echo ""
          
          # Check .gitignore
          echo "🔒 Checking .gitignore..."
          if [ -f ".gitignore" ]; then
            echo "  ✅ .gitignore found"
          else
            echo "  ⚠️ Warning: .gitignore not found (recommended)"
          fi
          echo ""
          
          # Summary
          echo "================================================"
          echo "📊 VALIDATION SUMMARY"
          echo "================================================"
          echo "  Total Errors: $ERROR_COUNT"
          echo ""
          
          if [ $ERROR_COUNT -eq 0 ]; then
            echo "✅✅✅ ALL REQUIRED FILES ARE PRESENT ✅✅✅"
            echo "🎉 GREEN BUILD - VALIDATION PASSED"
            echo "================================================"
            exit 0
          else
            echo "❌❌❌ VALIDATION FAILED - $ERROR_COUNT ERROR(S) FOUND ❌❌❌"
            echo ""
            echo "Required files in docs/ folder:"
            echo "  1. docs/ERD.png (or .pdf, .jpg, .jpeg)"
            echo "  2. docs/RaceDay_API_Endpoint_Plan.docx (or .md, .pdf)"
            echo "  3. docs/SQL.sql (or RaceDay_Database.sql)"
            echo "  4. README.md"
            echo ""
            echo "Current docs/ folder contents:"
            ls -la docs/ 2>/dev/null || echo "  docs/ folder does not exist"
            echo "================================================"
            exit 1
          fi
      
      - name: Analyze SQL (if exists)
        if: success() || failure()
        run: |
          echo ""
          echo "================================================"
          echo "🗄️ SQL SCRIPT ANALYSIS"
          echo "================================================"
          
          # Find any SQL file
          if [ -f "docs/SQL.sql" ]; then
            SQL_FILE="docs/SQL.sql"
          elif [ -f "docs/RaceDay_Database.sql" ]; then
            SQL_FILE="docs/RaceDay_Database.sql"
          elif [ -f "docs/database.sql" ]; then
            SQL_FILE="docs/database.sql"
          else
            echo "⚠️ No SQL file found for analysis"
            exit 0
          fi
          
          echo "📄 Analyzing: $SQL_FILE"
          echo ""
          
          TABLE_COUNT=$(grep -c "CREATE TABLE" "$SQL_FILE" 2>/dev/null || echo "0")
          echo "  📊 CREATE TABLE statements: $TABLE_COUNT"
          
          INSERT_COUNT=$(grep -c "INSERT INTO" "$SQL_FILE" 2>/dev/null || echo "0")
          echo "  📊 INSERT statements: $INSERT_COUNT"
          
          FK_COUNT=$(grep -c "FOREIGN KEY" "$SQL_FILE" 2>/dev/null || echo "0")
          echo "  📊 FOREIGN KEY constraints: $FK_COUNT"
          
          echo ""
          if [ $TABLE_COUNT -ge 6 ]; then
            echo "  ✅ Table count ($TABLE_COUNT) meets minimum of 6"
          else
            echo "  ⚠️ Warning: Table count ($TABLE_COUNT) is less than 6"
          fi
          
          echo ""
          echo "================================================"
      
      - name: Check commits
        run: |
          echo ""
          echo "================================================"
          echo "📊 COMMIT STATISTICS"
          echo "================================================"
          
          COMMIT_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo "0")
          echo "  📊 Total commits: $COMMIT_COUNT"
          
          if [ $COMMIT_COUNT -ge 20 ]; then
            echo "  ✅ Commit count meets minimum requirement (20+)"
          else
            echo "  ⚠️ Warning: Only $COMMIT_COUNT commits (minimum 20)"
          fi
          
          echo ""
          echo "================================================"
      
      - name: Success
        if: success()
        run: |
          echo ""
          echo "🎉🎉🎉================================================"
          echo "🎉🎉🎉  SUCCESS - GREEN BUILD PASSED  🎉🎉🎉"
          echo "🎉🎉🎉================================================"
          echo ""
          echo "✅ All required documentation files are present"
          echo "✅ Validation passed successfully"
          echo ""
          echo "🔗 Repository: ${{ github.repository }}"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo ""
          echo "📁 Files found in docs/:"
          ls -la docs/
          echo ""
          echo "💡 Next Steps:"
          echo "  1. Ensure YouTube video is uploaded and linked in README"
          echo "  2. Submit GitHub link on ARC"
          echo "================================================"
      
      - name: Failure
        if: failure()
        run: |
          echo ""
          echo "❌❌❌================================================"
          echo "❌❌❌  FAILED - RED BUILD  ❌❌❌"
          echo "❌❌❌================================================"
          echo ""
          echo "Missing required files!"
          echo ""
          echo "Fix by adding these files:"
          echo ""
          echo "  1. docs/ERD.png"
          echo "  2. docs/RaceDay_API_Endpoint_Plan.docx"
          echo "  3. docs/SQL.sql"
          echo "  4. README.md"
          echo ""
          echo "Current docs/ folder:"
          ls -la docs/ 2>/dev/null || echo "  docs folder missing"
          echo ""
          echo "Please add the missing files and push again."
          echo "================================================"
          exit 1
